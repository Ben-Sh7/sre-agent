[project]
name = "sre-agent"
version = "0.1.0"
description = "Investigates Prometheus alerts with read-only tools and proposes fixes for a human to approve."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Skip releases younger than a week: a hijacked release is usually found and
# pulled within days. An urgent security fix can be let through per package.
exclude-newer = "7 days"

[tool.ruff.lint]
select = [
    "E", "W",  # style errors and warnings
    "F",       # mistakes: unused imports, undefined names
    "I",       # import order
    "B",       # likely bugs
    "UP",      # modern syntax for the target Python
    "SIM",     # simpler equivalents
    "S",       # security: hardcoded passwords, shell calls, unsafe parsing
    "PT",      # pytest style
    "RUF",     # ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # pytest checks results with assert

[tool.mypy]
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib", "-ra"]
xfail_strict = true
